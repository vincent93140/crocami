name: Audit des images produits Croc’Ami

on:
  push:
    branches: [main]
    paths:
      - "catalogue.js"
      - "royalcanin*.js"
      - "marchands.js"
      - "references-complementaires.js"
      - "produits/**"
      - "scripts/build-product-pages.mjs"
      - "fabricants.js"
      - "app.js"
      - "affiliate.js"
      - "styles.css"
      - "index.html"
      - ".github/workflows/product-image-audit.yml"
      - "scripts/audit-product-images.mjs"
      - "scripts/audit-catalogue.mjs"
  workflow_dispatch:

# Les audits sont mis en file d'attente au lieu d'annuler les précédents.
concurrency:
  group: crocami-product-image-audit
  cancel-in-progress: false

# L'audit ne modifie plus la branche main.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Configurer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Vérifier la syntaxe des scripts du site
        run: node --check app.js && node --check catalogue.js && node --check fabricants.js && node --check affiliate.js

      - name: Contrôler la cohérence du catalogue
        run: node scripts/audit-catalogue.mjs

      - name: Vérifier les pages produits et le sitemap
        run: node scripts/build-product-pages.mjs --check

      - name: Tester chaque image
        run: node scripts/audit-product-images.mjs

      - name: Archiver les rapports de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crocami-audit-images
          path: |
            reports/product-image-audit.csv
            reports/product-image-audit-summary.json
          if-no-files-found: warn
          retention-days: 14
